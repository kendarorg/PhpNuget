<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <!-- Sfondo bianco -->
    <rect x="0" y="0" width="64" height="64" fill="#ffffff"/>

    <!-- Clipboard -->
    <rect x="16" y="10" width="32" height="44" rx="3" ry="3"
          fill="none" stroke="#000000" stroke-width="3"/>

    <!-- Clip superiore -->
    <rect x="24" y="6" width="16" height="8" rx="2" ry="2"
          fill="#000000"/>

    <!-- Righe -->
    <line x1="22" y1="24" x2="42" y2="24" stroke="#000000" stroke-width="3"/>
    <line x1="22" y1="32" x2="42" y2="32" stroke="#000000" stroke-width="3"/>
    <line x1="22" y1="40" x2="42" y2="40" stroke="#000000" stroke-width="3"/>

    <!-- Check -->
    <polyline points="18,24 20,26 24,22"
              fill="none" stroke="#000000" stroke-width="3"/>
</svg>
